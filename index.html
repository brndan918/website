<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>驗證中...</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            width: 300px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #4ade80);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>請稍候，驗證中...</h2>
        <p id="status">正在為您導向頁面</p>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <script>
        // ⭐ 只要改這裡就能換跳轉網址
        const TARGET_URL = "https://6b87-211-76-58-117.ngrok-free.app"; // change here with py

        const KEY = "visit_time_v1";
        const now = Date.now();
        const saved = localStorage.getItem(KEY);

        let delay = 3000; // 預設 3 秒

        if (saved) {
            const last = parseInt(saved);
            const diff = now - last;

            // 20 分鐘內再訪問 → 加速
            if (diff <= 1200000) {
                delay = 400;
                document.getElementById("status").innerText = "請稍後，驗證中...";
            }
        }

        // 更新時間
        localStorage.setItem(KEY, now);

        // 進度條動畫
        const progress = document.getElementById("progress");
        progress.style.transition = "width " + delay + "ms linear";

        setTimeout(() => {
            progress.style.width = "100%";
        }, 10);

        // 跳轉
        setTimeout(() => {
            window.location.href = TARGET_URL;
        }, delay);
    </script>
</body>
</html>
